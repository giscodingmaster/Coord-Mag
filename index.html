        // =====================================================================================

        function wgs84ToUtm(lat, lon) {
            const a = 6378137.0;
            const e_val = 0.0818191908426;
            const k0 = 0.9996;
            const zone = Math.floor((lon + 180) / 6) + 1;
            const lonOrigin = (zone - 1) * 6 - 180 + 3;
            const falseEasting = 500000;
            const falseNorthing = lat < 0 ? 10000000 : 0;
            const latRad = lat * Math.PI / 180;
            const lonRad = lon * Math.PI / 180;
            const lonOriginRad = lonOrigin * Math.PI / 180;
            const e2 = e_val * e_val;
            const e4 = e2 * e2;
            const e6 = e4 * e2;
            const ep2 = e2 / (1 - e2);
            const N = a / Math.sqrt(1 - e2 * Math.sin(latRad) * Math.sin(latRad));
            const T = Math.tan(latRad) * Math.tan(latRad);
            const C = ep2 * Math.cos(latRad) * Math.cos(latRad);
            const A = (lonRad - lonOriginRad) * Math.cos(latRad);
            const M = a * ((1 - e2 / 4 - 3 * e4 / 64 - 5 * e6 / 256) * latRad - (3 * e2 / 8 + 3 * e4 / 32 + 45 * e6 / 1024) * Math.sin(2 * latRad) + (15 * e4 / 256 + 45 * e6 / 1024) * Math.sin(4 * latRad) - (35 * e6 / 3072) * Math.sin(6 * latRad));
            const x = k0 * N * (A + (1 - T + C) * A * A * A / 6 + (5 - 18 * T + T * T + 72 * C - 58 * ep2) * A * A * A * A * A / 120) + falseEasting;
            const y = k0 * (M + N * Math.tan(latRad) * (A * A / 2 + (5 - T + 9 * C + 4 * C * C) * A * A * A * A / 24 + (61 - 58 * T + T * T + 600 * C - 330 * ep2) * A * A * A * A * A * A / 720)) + falseNorthing;
            return { x: x.toFixed(4), y: y.toFixed(4) };
        }

        function extractCoordinates(url) {
            const patterns = [/@(-?\d+\.\d+),(-?\d+\.\d+)/, /!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/, /ll=(-?\d+\.\d+),(-?\d+\.\d+)/, /maps\?q=(-?\d+\.\d+),(-?\d+\.\d+)/];
            for (const pattern of patterns) {
                const match = url.match(pattern);
                if (match) {
                    return { lat: parseFloat(match[1]), lon: parseFloat(match[2]) };
                }
            }
            return null;
        }

                    const data = snapshot.val();
                    const loadedRecords = [];
                    if (data) {
                        for (const key in data) {
                            loadedRecords.push({ id: key, ...data[key] });
                        }
                    }
                    setRecords(loadedRecords.sort((a, b) => new Date(b.timestamp).getTime() - new Date(a.timestamp).getTime()));
                });
                return () => recordsRef.off('value', listener);
            }, [isFirebaseReady]);

                setAlert({ message, type });

                const pastedText = e.clipboardData.getData('text');

                if (coords) {
                    const utm = wgs84ToUtm(coords.lat, coords.lon);
                    setQuickResult(utm);
                }
            };

                const utm = wgs84ToUtm(coords.lat, coords.lon);
                const db = window.firebase.database();
                if (editingId) {
                    const recordToUpdate = records.find(r => r.id === editingId);
                    if (!recordToUpdate) return;
                    const updatedRecord = { ...recordToUpdate, entityName, crn, x: utm.x, y: utm.y, lat: coords.lat.toFixed(7), lon: coords.lon.toFixed(7), comment, updated: new Date().toLocaleString('ar-EG') };
                    await db.ref(`records/${editingId}`).set(updatedRecord);
                    showAlert('تم تحديث السجل بنجاح', 'success');

                    const newRecord = { entityName, crn, x: utm.x, y: utm.y, lat: coords.lat.toFixed(7), lon: coords.lon.toFixed(7), comment, timestamp: new Date().toLocaleString('ar-EG') };
                    await db.ref('records').push(newRecord);
                    showAlert('تمت إضافة السجل بنجاح', 'success');
                }
                resetForm();
            };

            const handleEdit = (record) => {

                        e('div', null, e('label', { htmlFor: "googleLink", className: "block text-sm font-medium text-slate-700 mb-1" }, "رابط Google Maps *"), e('textarea', { id: "googleLink", value: googleLink, onChange: (ev) => setGoogleLink(ev.target.value), onPaste: handlePaste, rows: 3, className: "w-full p-2 border border-slate-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500 bg-white", placeholder: "الصق الرابط هنا...", required: true }), e('p', { className: "text-xs text-slate-500 mt-1" }, "يتم التحويل التلقائي عند لصق الرابط.")),

                        quickResult && e('div', { className: "p-3 bg-indigo-50 border-l-4 border-indigo-400 text-indigo-800 rounded-md" }, e('p', { className: "font-semibold" }, "✓ تم التحويل:"), e('p', { className: "font-mono text-sm" }, `X = ${quickResult.x}`), e('p', { className: "font-mono text-sm" }, `Y = ${quickResult.y}`))
                    ),
                    e('div', { className: "mt-6 space-y-2" },
                        e('button', { type: "submit", className: "w-full bg-indigo-600 text-white font-bold py-2 px-4 rounded-md hover:bg-indigo-700 transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500" }, editingId ? '💾 تحديث السجل' : '✅ إضافة السجل'),

            const [isPasswordModalOpen, setIsPasswordModalOpen] = useState(false);
            const [passwordInput, setPasswordInput] = useState('');
